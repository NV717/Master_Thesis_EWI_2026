[project]
name = "master-thesis-ewi-2026"
version = "0.1.0"
description = "Multivariate Generation of Synthetic Electricity and Heatload Profiles for Residential Buildings Using Diffusion Modells"

requires-python = ">=3.12,<3.13"

dependencies = [
    "diffusers>=0.40.0",
    "einops>=0.8.2",
    "ema-pytorch>=0.8.3",
    "fastparquet>=2026.5.0",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scikit-multilearn>=0.2.0",
    "tables>=3.11.1",
    "torch",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchvision",
    "tqdm>=4.70.0",
    "wandb>=0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

